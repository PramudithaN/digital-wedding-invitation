name: Daily Supabase Database Backup

on:
  schedule:
    # Runs every day at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allows you to run this workflow manually from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Backup Directory
        run: mkdir -p backups

      - name: Dump Database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Generate a timestamp for the filename
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
          BACKUP_FILE="backups/wedding_db_backup_${TIMESTAMP}.sql"
          
          echo "Starting database backup using Postgres 17 Docker image..."
          # Run pg_dump using the postgres:17 docker image to match Supabase's server version
          docker run --rm postgres:17 pg_dump "$SUPABASE_DB_URL" --clean --if-exists --format=plain --no-owner --no-privileges > "$BACKUP_FILE"
          
          echo "Backup completed successfully!"
          
      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-db-backup
          path: backups/*.sql
          retention-days: 90 # GitHub will store this safely for 90 days for free
